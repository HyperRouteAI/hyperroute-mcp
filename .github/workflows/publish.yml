# Publishes to PyPI when a GitHub Release is published.
#
# Authentication is Trusted Publishing (OIDC): PyPI is configured to trust THIS workflow in THIS
# repo, so there is no API token to create, store, or leak. Build and publish are split so the job
# holding `id-token: write` does nothing but upload a prebuilt artifact.

name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # optional gate — lets you require a reviewer before a release ships
    permissions:
      id-token: write          # the OIDC token PyPI verifies; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
