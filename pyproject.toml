[project]
name = "hyperroute-mcp"
version = "0.5.2"
description = "MCP server for HyperRoute — routes each task to the best external tool and runs it for your coordinator agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "HyperRouteAI" }]
keywords = ["mcp", "model-context-protocol", "hyperroute", "agents", "tool-routing", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://hyperroute.io"
Repository = "https://github.com/HyperRouteAI/hyperroute-mcp"
Issues = "https://github.com/HyperRouteAI/hyperroute-mcp/issues"

[project.scripts]
hyperroute-mcp = "hyperroute_mcp.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hyperroute_mcp"]

[tool.setuptools.package-data]
hyperroute_mcp = ["collectors.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
